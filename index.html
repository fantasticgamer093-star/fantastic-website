<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About FANTASTIC</title>

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e5e7eb;
}

/* ===== NEON EFFECT ===== */
.neon {
  text-align: center;
  font-size: 40px;
  text-shadow:
    0 0 5px #38bdf8,
    0 0 15px #38bdf8,
    0 0 30px #0ea5e9;
  animation: neonPulse 1.5s infinite alternate;
}

@keyframes neonPulse {
  from { opacity: 0.7; }
  to { opacity: 1; }
}

/* ===== CONTAINER ===== */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* ===== BOX ===== */
.box {
  background: rgba(2,6,23,0.8);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow:
    0 0 10px rgba(56,189,248,0.4),
    0 0 30px rgba(14,165,233,0.3);
  animation: fadeUp 1s ease forwards;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== LINKS ===== */
a {
  color: #38bdf8;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

/* ===== LIST ===== */
ul {
  list-style: none;
  padding: 0;
}
li {
  margin: 10px 0;
}

/* ===== RATING ===== */
.stars span {
  font-size: 30px;
  cursor: pointer;
  color: #334155;
}
.stars span.active {
  color: gold;
}

/* ===== INPUT ===== */
textarea {
  width: 100%;
  height: 80px;
  border-radius: 8px;
  border: none;
  padding: 10px;
  margin-top: 10px;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  color: #020617;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #0ea5e9;
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  margin-top: 30px;
  opacity: 0.7;
}
</style>
</head>

<body>

<h1 class="neon">FANTASTIC</h1>

<div class="container">

  <div class="box">
    <h2>Professional Discord & Minecraft Services & Web Designer</h2>
    <p>Gamer • Professional • Trusted</p>
  </div>

  <div class="box">
    <h2>💼 About</h2>
    <ul>
      <li>✔ Discord Server Setup</li>
      <li>✔ Minecraft Server Management</li>
      <li>✔ Web Designer</li>
    </ul>
  </div>

  <div class="box">
    <h2>⭐ Rate & Review</h2>

    <div class="stars">
      <span onclick="setRating(1)">★</span>
      <span onclick="setRating(2)">★</span>
      <span onclick="setRating(3)">★</span>
      <span onclick="setRating(4)">★</span>
      <span onclick="setRating(5)">★</span>
    </div>

    <p id="selected-rating">Select rating</p>

    <textarea id="review" placeholder="Write your review..."></textarea>
    <button onclick="submitReview()">Submit</button>

    <p id="output"></p>
  </div>

  <div class="box">
    <h2>📩 Contact Me</h2>
    <p><a href="https://discord.gg/BarBDuFXnw" target="_blank">Discord Server</a></p>
    <p><a href="https://www.instagram.com/fantastic0g" target="_blank">Instagram</a></p>
  </div>

</div>

<footer>
  © 2026 About FANTASTIC
</footer>

<script>
let currentRating = 0;

function setRating(value) {
  currentRating = value;
  document.getElementById("selected-rating").innerText =
    "You selected " + value + " ★";

  document.querySelectorAll(".stars span").forEach((star, index) => {
    star.classList.toggle("active", index < value);
  });
}

function submitReview() {
  const review = document.getElementById("review").value;

  if (currentRating === 0) {
    alert("Please select rating ⭐");
    return;
  }

  if (review.trim() === "") {
    alert("Write a review first");
    return;
  }

  document.getElementById("output").innerText =
    "Thanks for " + currentRating + "★ rating!";
  document.getElementById("review").value = "";
}
</script>

</body>
  </html>
